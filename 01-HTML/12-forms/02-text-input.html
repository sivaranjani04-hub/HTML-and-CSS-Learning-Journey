<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Input</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Text Input</h1>
    <form action="result.html" method="get">
      <!-- label "for" must match the input "id": clicking the label focuses the input -->
      <label for="fname">First name (required):</label>
      <input
        type="text"
        id="fname"
        name="fname"
        placeholder="e.g. Asha"
        required
      />
      <label for="nick">Nickname (3 to 10 characters):</label>
      <input type="text" id="nick" name="nick" minlength="3" maxlength="10" />
      <label for="city">City (with a starting value):</label>
      <input type="text" id="city" name="city" value="Madurai" />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
