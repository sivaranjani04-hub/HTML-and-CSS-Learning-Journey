<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date and Number</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Date and Number</h1>
    <form action="result.html" method="get">
      <label for="dob">Date of birth:</label>
      <input type="date" id="dob" name="dob" />
      <label for="age">Age (18 to 60):</label>
      <!-- min and max limit the allowed number -->
      <input type="number" id="age" name="age" min="18" max="60" value="20" />
      <label for="qty">Quantity (step of 5):</label>
      <input type="number" id="qty" name="qty" min="0" max="100" step="5" />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
