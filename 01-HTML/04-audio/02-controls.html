<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Controls</title>
  </head>
  <body>
    <h1>Audio with Controls</h1>
    <!-- controls adds play, pause and volume buttons -->
    <audio controls src="assets/audio/melody.mp3">
      Your browser does not support audio.
    </audio>
  </body>
</html>
