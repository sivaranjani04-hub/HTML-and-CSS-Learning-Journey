<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Audio</title>
  </head>
  <body>
    <h1>Basic Audio</h1>
    <!-- Without "controls" nothing is visible on screen! -->
    <audio src="assets/audio/melody.mp3"></audio>
    <p>
      The audio element above exists but is invisible because it has no
      <code>controls</code>. See the next example.
    </p>
  </body>
</html>
