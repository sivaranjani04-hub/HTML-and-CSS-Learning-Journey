<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autoplay + Muted</title>
  </head>
  <body>
    <h1>Autoplay + Muted</h1>
    <!-- Browsers block autoplay with sound. autoplay only works reliably together with muted -->
    <audio controls autoplay muted src="assets/audio/melody.mp3"></audio>
    <p>
      It starts automatically but is muted. Click the speaker icon to unmute.
    </p>
  </body>
</html>
