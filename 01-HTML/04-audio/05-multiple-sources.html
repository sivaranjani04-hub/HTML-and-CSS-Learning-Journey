<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Sources</title>
  </head>
  <body>
    <h1>Multiple Sources (Fallback)</h1>
    <audio controls>
      <!-- The browser uses the FIRST format it understands -->
      <source src="assets/audio/melody.mp3" type="audio/mpeg" />
      <source src="assets/audio/melody.wav" type="audio/wav" />
      Your browser does not support the audio element.
    </audio>
  </body>
</html>
