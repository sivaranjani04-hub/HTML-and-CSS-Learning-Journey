<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relative Audio Path</title>
  </head>
  <body>
    <h1>Relative Audio Paths</h1>
    <!-- assets/audio/ is a folder inside this topic folder -->
    <p>Melody (MP3):</p>
    <audio controls src="assets/audio/melody.mp3"></audio>
    <p>Beep (WAV):</p>
    <audio controls src="assets/audio/beep.wav"></audio>
  </body>
</html>
