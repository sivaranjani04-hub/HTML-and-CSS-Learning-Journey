<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Players</title>
  </head>
  <body>
    <h1>Multiple Audio Players</h1>
    <h3>Melody</h3>
    <audio controls>
      <source src="assets/audio/melody.mp3" type="audio/mpeg" />
      <source src="assets/audio/melody.wav" type="audio/wav" />
    </audio>
    <h3>Beep</h3>
    <audio controls>
      <source src="assets/audio/beep.mp3" type="audio/mpeg" />
      <source src="assets/audio/beep.wav" type="audio/wav" />
    </audio>
  </body>
</html>
