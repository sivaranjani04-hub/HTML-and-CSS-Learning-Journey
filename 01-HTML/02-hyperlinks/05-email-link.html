<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Link</title>
  </head>
  <body>
    <h1>Email Link</h1>
    <!-- mailto: opens the visitor's email app -->
    <p><a href="mailto:someone@example.com">Send an email</a></p>
    <!-- You can also pre-fill the subject -->
    <p>
      <a href="mailto:someone@example.com?subject=Hello%20there"
        >Send an email with a subject</a
      >
    </p>
  </body>
</html>
