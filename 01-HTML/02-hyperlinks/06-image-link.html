<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Link</title>
  </head>
  <body>
    <h1>Image as a Link</h1>
    <!-- Put an <img> inside <a> to make the picture clickable -->

      <img
        src="assets/logo.png"
        alt="Logo - click to open the About page"
        width="120"
      />
    </a>
    <p>Click the logo above.</p>
  </body>
</html>
