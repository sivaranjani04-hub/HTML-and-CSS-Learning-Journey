<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Title Attribute</title>
  </head>
  <body>
    <h1>Title Attribute</h1>
    <!-- title shows a small tooltip when you hover over the link -->
    <p>
      <a
        href="https://developer.mozilla.org"
        title="Free documentation for web developers"
        >Hover over me!</a
      >
    </p>
  </body>
</html>
