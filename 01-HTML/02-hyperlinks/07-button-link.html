<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Link</title>
  </head>
  <body>
    <h1>Button as a Link</h1>
    <!-- Simplest way: wrap a <button> inside an <a> -->
    <a href="pages/about.html"><button>Go to About page</button></a>
    <!-- Or style a link so it LOOKS like a button (see 11-buttons) -->
    <p>
      <a
        href="pages/about.html"
        style="
          background: #3f51b5;
          color: white;
          padding: 10px 18px;
          text-decoration: none;
          border-radius: 6px;
        "
        >Link styled as a button</a
      >
    </p>
  </body>
</html>
