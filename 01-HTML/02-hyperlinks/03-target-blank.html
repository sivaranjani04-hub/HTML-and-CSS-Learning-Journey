<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>target="_blank"</title>
  </head>
  <body>
    <h1>Open in a New Tab</h1>
    <!-- target="_blank" opens the link in a new tab. rel="noopener" is a safety best practice -->
    <p>
      <a href="https://www.wikipedia.org" target="_blank" rel="noopener"
        >Open Wikipedia in a new tab</a
      >
    </p>
    <p>
      <a href="https://www.wikipedia.org">Open Wikipedia in the SAME tab</a>
    </p>
  </body>
</html>
