<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ordered List</title>
  </head>
  <body>
    <h1>Ordered List</h1>
    <!-- <ol> = numbered list -->
    <ol>
      <li>Wake up</li>
      <li>Brush teeth</li>
      <li>Code!</li>
    </ol>
    <p>
      type="A" gives letters, type="I" gives Roman numerals, start="5" starts at
      5:
    </p>
    <ol type="A">
      <li>Alpha</li>
      <li>Beta</li>
    </ol>
    <ol type="I">
      <li>One</li>
      <li>Two</li>
    </ol>
    <ol start="5">
      <li>Five</li>
      <li>Six</li>
    </ol>
  </body>
</html>
