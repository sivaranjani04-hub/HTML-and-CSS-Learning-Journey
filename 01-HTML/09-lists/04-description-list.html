    <title>Description List</title>
  </head>
  <body>

      <dd>HyperText Markup Language - the structure of a web page.</dd>
      <dt>CSS</dt>
      <dd>Cascading Style Sheets - the look of a web page.</dd>
    </dl>
  </body>
</html>
