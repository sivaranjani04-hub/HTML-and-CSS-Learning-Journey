<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nested List</title>
  </head>
  <body>
    <h1>Nested List</h1>
    <!-- A list placed INSIDE an <li> makes a nested list -->
    <ul>
      <li>
        Fruits
        <ul>
          <li>Apple</li>
          <li>Mango</li>
        </ul>
      </li>
      <li>
        Vegetables
        <ol>
          <li>Carrot</li>
          <li>Beans</li>
        </ol>
      </li>
    </ul>
  </body>
</html>
