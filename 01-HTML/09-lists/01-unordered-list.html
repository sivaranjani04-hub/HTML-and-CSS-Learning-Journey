<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unordered List</title>
  </head>
  <body>
    <h1>Unordered List</h1>
    <!-- <ul> = bullet list, <li> = each item -->
    <ul>
      <li>Apples</li>
      <li>Bananas</li>
      <li>Cherries</li>
    </ul>
    <p>Different bullet styles (using CSS list-style-type):</p>
    <ul style="list-style-type: square">
      <li>Square</li>
      <li>Square</li>
    </ul>
    <ul style="list-style-type: circle">
      <li>Circle</li>
      <li>Circle</li>
    </ul>
    <ul style="list-style-type: none">
      <li>No bullets</li>
      <li>No bullets</li>
    </ul>
  </body>
</html>
