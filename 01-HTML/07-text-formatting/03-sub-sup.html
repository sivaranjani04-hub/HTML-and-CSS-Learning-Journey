<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subscript and Superscript</title>
  </head>
  <body>
    <h1>Subscript and Superscript</h1>
    <p>Water: H<sub>2</sub>O (sub = lowered)</p>
    <p>Area: 5m<sup>2</sup> (sup = raised)</p>
    <p>E = mc<sup>2</sup></p>
  </body>
</html>
