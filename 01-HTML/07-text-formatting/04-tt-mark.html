<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tt and mark</title>
  </head>
  <body>
    <h1>tt and mark</h1>
    <!-- <tt> (teletype) is OLD/deprecated - it shows monospace text. Modern replacement: <code> -->
    <p>Teletype: <tt>print("hello")</tt></p>
    <p>Modern: <code>print("hello")</code></p>
    <!-- <mark> highlights text like a highlighter pen -->
    <p>Do not forget to <mark>revise HTML today</mark>.</p>
    <!-- Change the highlight colour with inline CSS -->
    <p>
      Custom colours:
      <mark style="background-color: lightgreen">green</mark> and
      <mark style="background-color: lightpink; color: darkred">pink</mark>.
    </p>
  </body>
</html>
