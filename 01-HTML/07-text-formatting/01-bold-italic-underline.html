<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bold, Italic, Underline</title>
  </head>
  <body>
    <h1>Bold, Italic, Underline</h1>
    <p><b>Bold text (b)</b> – just looks bold.</p>
    <p><strong>Strong text (strong)</strong> – bold AND important meaning.</p>
    <p><i>Italic text (i)</i> – just looks italic.</p>
    <p><em>Emphasized text (em)</em> – italic AND stressed meaning.</p>
    <p><u>Underlined text (u)</u></p>
  </body>
</html>
