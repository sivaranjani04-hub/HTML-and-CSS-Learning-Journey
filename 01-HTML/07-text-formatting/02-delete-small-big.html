<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete, Small, Big</title>
  </head>
  <body>
    <h1>Delete, Small, Big</h1>
    <p>Price: <del>$100</del> $80 &nbsp;(del = strike-through)</p>
    <p>Normal text and <small>small text (small)</small></p>
    <!-- <big> is OLD (deprecated). It still works in browsers but use CSS font-size instead -->
    <p>Normal text and <big>big text (big, deprecated)</big></p>
    <p>
      Modern way: <span style="font-size: 1.5em">bigger text using CSS</span>
    </p>
  </body>
</html>
