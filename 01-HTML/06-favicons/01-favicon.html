<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favicon Example</title>
    <!-- rel="icon" tells the browser this file is the site icon; type = file format; href = relative path -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
  </head>
  <body>
    <h1>Look at the browser tab!</h1>
    <p>The small pink icon on the tab is the favicon.</p>
  </body>
</html>
