<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favicon SVG and ICO</title>
    <!-- Browsers pick the first one they support -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico" />
  </head>
  <body>
    <h1>Other Favicon Formats</h1>
    <p>SVG scales perfectly; ICO is the old classic format.</p>
  </body>
</html>
