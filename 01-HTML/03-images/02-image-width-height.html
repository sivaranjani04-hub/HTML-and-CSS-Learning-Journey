<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Width and Height</title>
  </head>
  <body>
    <h1>Width and Height</h1>
    <!-- width/height are in pixels. Set only ONE to keep the proportions -->
    <img src="assets/dog.jpg" alt="Dog" width="150" />
    <img src="assets/dog.jpg" alt="Dog" width="300" /> <br /><br />
    <!-- Setting both can stretch the image -->
    <img src="assets/dog.jpg" alt="Stretched dog" width="300" height="100" />
  </body>
</html>
