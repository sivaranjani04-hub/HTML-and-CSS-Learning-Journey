<!DOCTYPE html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image as Link</title>
</head>
<body>
  <h1>Image as a Link</h1>
  <!-- <a> around <img> makes it clickable. Here it opens the full image -->
  <a href="assets/dog.jpg" target="_blank"><img src="assets/dog.jpg" alt="Dog - click to open full size" width="200"></a>
</body>
</html>
