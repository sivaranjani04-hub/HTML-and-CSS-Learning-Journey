<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Span (inline)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>&lt;span&gt; is INLINE</h1>
    <!-- span stays on the same line and is only as wide as its content -->
    <p>
      My favourite colour is <span class="red">red</span> and my favourite food
      is <span class="tag">pizza</span>.
    </p>
    <p>
      <span class="tag">one</span> <span class="tag">two</span>
      <span class="tag">three</span>
      (three spans sit side by side)
    </p>
  </body>
</html>
