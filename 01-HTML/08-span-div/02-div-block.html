<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Div (block)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>&lt;div&gt; is BLOCK</h1>
    <!-- div starts on a new line and stretches across the full width -->
    <div class="box">Div 1</div>
    <div class="box">Div 2</div>
    <div class="box">Div 3</div>
    <h2>A div as a card (container for other elements)</h2>
    <div class="card">
      <h3>Card title</h3>
      <p>A div groups several elements so you can style them together.</p>
    </div>
  </body>
</html>
