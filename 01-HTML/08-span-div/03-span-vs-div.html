<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Span vs Div</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Span vs Div</h1>
    <h2>Three spans (inline)</h2>
    <span class="box">Span A</span><span class="box">Span B</span
    ><span class="box">Span C</span>
    <h2>Three divs (block)</h2>
    <div class="box">Div A</div>
    <div class="box">Div B</div>
    <div class="box">Div C</div>
    <h2>Div styled inline with the style attribute</h2>
    <div style="background: lightblue; padding: 10px">Styled div</div>
    <p>
      Styled <span style="color: purple; font-size: 24px">span</span> inside a
      paragraph.
    </p>
  </body>
</html>
