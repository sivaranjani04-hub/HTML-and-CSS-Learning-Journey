<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comments</title>
  </head>
  <body>
    <!-- This is a comment. It is visible in the code but NOT in the browser. -->
    <p>You can see this paragraph.</p>
    <!-- <p>This paragraph is commented out, so it is hidden.</p> -->
    <p>Use comments to leave notes or to temporarily hide code.</p>
  </body>
</html>
