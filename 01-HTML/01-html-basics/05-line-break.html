<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Line Break</title>
  </head>
  <body>
    <!-- <br> forces a new line. It has no closing tag (void element) -->
    <p>
      Roses are red,<br />
      Violets are blue,<br />
      HTML is fun,<br />
      And so are you.
    </p>
  </body>
</html>
