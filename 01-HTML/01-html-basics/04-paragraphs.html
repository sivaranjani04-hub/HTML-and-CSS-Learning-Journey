<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paragraphs</title>
  </head>
  <body>
    <!-- <p> makes a paragraph. Browsers add space above and below it -->
    <p>This is the first paragraph. It can contain as much text as you like.</p>
    <p>
      This is the second paragraph. Extra spaces and line breaks inside the code
      are ignored by the browser.
    </p>
  </body>
</html>
