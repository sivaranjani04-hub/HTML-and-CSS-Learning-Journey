<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizontal Rule</title>
  </head>
  <body>
    <h2>Section One</h2>
    <p>Some text about section one.</p>
    <!-- <hr> draws a horizontal line to separate content -->
    <hr />
    <h2>Section Two</h2>
    <p>Some text about section two.</p>
  </body>
</html>
