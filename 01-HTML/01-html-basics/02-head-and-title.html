<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I appear on the browser tab</title>
  </head>
  <body>
    <!-- <title> (inside <head>) is the text shown on the browser tab -->
    <p>Look at the browser tab: the text comes from the &lt;title&gt; tag.</p>
    <p>
      The &lt;head&gt; holds information ABOUT the page (title, charset,
      styles). It is not shown on the page itself.
    </p>
  </body>
</html>
