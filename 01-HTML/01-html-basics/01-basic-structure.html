<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Structure</title>
  </head>
  <body>
    <!-- Everything the visitor SEES goes inside <body> -->
    <h1>Hello, HTML!</h1>
    <p>This is the smallest complete HTML page.</p>
  </body>
</html>
