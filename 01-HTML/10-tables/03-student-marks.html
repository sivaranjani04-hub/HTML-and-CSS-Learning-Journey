<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Marks</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Student Marks</h1>
    <table>
      <tr>
        <th>Student</th>
        <th>Maths</th>
        <th>Science</th>
        <th>English</th>
        <th>Total</th>
      </tr>
      <tr>
        <td>Asha</td>
        <td class="center pass">85</td>
        <td class="center pass">90</td>
        <td class="center pass">78</td>
        <td class="center">253</td>
      </tr>
      <tr>
        <td>Ravi</td>
        <td class="center pass">72</td>
        <td class="center fail">35</td>
        <td class="center pass">64</td>
        <td class="center">171</td>
      </tr>
      <tr>
        <td>Meena</td>
        <td class="center pass">91</td>
        <td class="center pass">88</td>
        <td class="center pass">95</td>
        <td class="center">274</td>
      </tr>
    </table>
    <p>Green = pass, red = fail (background colours using CSS classes).</p>
  </body>
</html>
