<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store Hours</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Store Hours</h1>
    <table>
      <tr>
        <th>Day</th>
        <th>Opens</th>
        <th>Closes</th>
      </tr>
      <tr>
        <td>Monday - Friday</td>
        <td class="center">9:00 AM</td>
        <td class="center">6:00 PM</td>
      </tr>
      <tr>
        <td>Saturday</td>
        <td class="center">10:00 AM</td>
        <td class="center">4:00 PM</td>
      </tr>
      <tr>
        <td>Sunday</td>
        <td class="center" colspan="2">Closed</td>
      </tr>
      <!-- colspan merges 2 columns -->
    </table>
  </body>
</html>
