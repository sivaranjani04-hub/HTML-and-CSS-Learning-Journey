<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Table</title>
  </head>
  <body>
    <h1>Basic Table</h1>
    <!-- table > tr (row) > th (header cell) / td (data cell) -->
    <table border="1">
      <tr>
        <th>Name</th>
        <th>Age</th>
      </tr>
      <tr>
        <td>Asha</td>
        <td>20</td>
      </tr>
      <tr>
        <td>Ravi</td>
        <td>21</td>
      </tr>
    </table>
    <p>
      The border="1" attribute is old; modern pages use CSS (see the next
      examples).
    </p>
  </body>
</html>
