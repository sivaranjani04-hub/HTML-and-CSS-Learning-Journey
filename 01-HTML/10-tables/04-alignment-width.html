<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alignment and Width</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Alignment and Width</h1>
    <table style="width: 100%">
      <tr>
        <th style="width: 50%">Left (default)</th>
        <th class="center">Centre</th>
        <th class="right">Right</th>
      </tr>
      <tr>
        <td>text</td>
        <td class="center">text</td>
        <td class="right">text</td>
      </tr>
    </table>
    <table style="width: 300px">
      <tr>
        <th>Fixed 300px wide table</th>
      </tr>
      <tr>
        <td>Width can be px or %</td>
      </tr>
    </table>
  </body>
</html>
