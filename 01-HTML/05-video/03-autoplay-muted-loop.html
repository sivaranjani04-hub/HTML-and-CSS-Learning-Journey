<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autoplay Muted Loop</title>
  </head>
  <body>
    <h1>Autoplay, Muted, Loop</h1>
    <!-- autoplay needs muted to work in modern browsers -->
    <video
      src="assets/video/sample.mp4"
      width="320"
      autoplay
      muted
      loop
      controls
    ></video>
  </body>
</html>
