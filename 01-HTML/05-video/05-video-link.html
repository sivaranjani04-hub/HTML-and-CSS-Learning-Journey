<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Link</title>
  </head>
  <body>
    <h1>Video as a Hyperlink</h1>
    <!-- Link to the video file; target="_blank" opens it in a new tab -->
    <p>
      <a href="assets/video/sample.mp4" target="_blank" rel="noopener"
        >Open the video in a new tab</a
      >
    </p>
    <!-- A poster image that links to the video -->
    <a href="assets/video/sample.mp4" target="_blank" rel="noopener"
      ><img
        src="assets/images/poster.jpg"
        alt="Click to watch the video"
        width="200"
    /></a>
  </body>
</html>
