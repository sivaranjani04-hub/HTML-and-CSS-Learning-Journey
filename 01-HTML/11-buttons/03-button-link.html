<!doctype html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Link</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Button as a Hyperlink</h1>
    <!-- Option 1: put the button inside an <a> -->
    <a href="https://www.wikipedia.org" target="_blank" rel="noopener"
      ><button class="btn">Open Wikipedia</button></a
    >
    <!-- Option 2: use onclick with JavaScript to change the page -->
    <button
      class="btn green"
      onclick="window.location.href = 'https://developer.mozilla.org'"
    >
      Go to MDN
    </button>
  </body>
</html>
