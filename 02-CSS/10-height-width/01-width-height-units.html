<!DOCTYPE html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>width and height units</title>
  <link rel="stylesheet" href="01-width-height-units.css">
</head>
<body>
  <div class="px">width: 300px; height: 50px</div>
  <div class="pct">width: 50% (of the parent)</div>
  <div class="auto">width: auto (default: fills the parent)</div>
  <div class="vw">width: 40vw (40% of the browser width)</div>
  <div class="vh">height: 20vh (20% of the browser height)</div>
</body>
</html>
