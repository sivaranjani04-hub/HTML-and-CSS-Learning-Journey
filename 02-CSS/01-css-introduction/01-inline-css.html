<!DOCTYPE html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inline CSS</title>
</head>
<body>
  <!-- Inline CSS: the style attribute on ONE element only -->
  <h1 style="color: blue; text-align: center;">Inline CSS heading</h1>
  <p style="color: green; font-size: 20px;">This paragraph is styled with the style attribute.</p>
  <p>This paragraph has no style.</p>
</body>
</html>
