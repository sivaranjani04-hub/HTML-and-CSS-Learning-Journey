<!DOCTYPE html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internal CSS</title>
  <style>
    /* Element selector: styles EVERY <h1> and <p> on this page */
    h1 { color: darkred; }
    p  { color: navy; font-size: 18px; }
  </style>
</head>
<body>
  <h1>Internal CSS heading</h1>
  <p>Styles live inside the &lt;style&gt; tag in the head.</p>
  <p>All paragraphs share the same style.</p>
</body>
</html>
