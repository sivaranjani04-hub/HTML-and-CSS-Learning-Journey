<!DOCTYPE html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Selector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- A class can be reused on MANY elements, and an element can have many classes -->
  <p class="note">Note one</p>
  <p class="note">Note two</p>
  <p class="note important">Note three (note + important)</p>
  <p>Normal paragraph</p>
  <h2 class="important">An important heading</h2>
</body>
</html>
