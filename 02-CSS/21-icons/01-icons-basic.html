<!DOCTYPE html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icons</title>
  <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Font Awesome Icons</h1>
  <p>Each icon is an &lt;i&gt; tag with classes (the library is stored locally in assets/fontawesome).</p>
  <div class="row medium">
    <i class="fa-solid fa-house"></i>        <!-- home -->
    <i class="fa-brands fa-x-twitter"></i>   <!-- Twitter / X -->
    <i class="fa-brands fa-youtube"></i>     <!-- YouTube -->
    <i class="fa-brands fa-tiktok"></i>      <!-- TikTok -->
    <i class="fa-brands fa-instagram"></i>
    <i class="fa-brands fa-github"></i>
    <i class="fa-solid fa-envelope"></i>
  </div>
</body>
</html>
