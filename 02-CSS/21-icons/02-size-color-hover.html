<!DOCTYPE html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Size Color Hover</title>
  <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Size, colour, hover, spacing</h1>
  <h3>Size</h3>
  <div class="row"><i class="fa-solid fa-house small"></i><i class="fa-solid fa-house medium"></i><i class="fa-solid fa-house large"></i></div>
  <h3>Colour</h3>
  <div class="row medium"><i class="fa-brands fa-youtube red"></i><i class="fa-brands fa-x-twitter blue"></i><i class="fa-brands fa-tiktok green"></i></div>
  <h3>Hover colour (move the mouse over them)</h3>
  <div class="row medium hover"><a href="#"><i class="fa-solid fa-house"></i></a><a href="#"><i class="fa-brands fa-youtube"></i></a><a href="#"><i class="fa-brands fa-tiktok"></i></a></div>
  <h3>Icon inside a button</h3>
  <button><i class="fa-solid fa-house"></i> Home</button>
</body>
</html>
