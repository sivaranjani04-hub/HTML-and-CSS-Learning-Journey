<!DOCTYPE html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>block, inline, inline-block</title>
  <link rel="stylesheet" href="01-block-inline-inline-block.css">
</head>
<body>
  <h2>block</h2>
  <div class="blk">Block 1</div><div class="blk">Block 2</div>
  <h2>inline (width/height ignored)</h2>
  <span class="inl">Inline 1</span><span class="inl">Inline 2</span>
  <h2>inline-block (same line, width/height work)</h2>
  <span class="ib">Inline-block 1</span><span class="ib">Inline-block 2</span>
</body>
</html>
