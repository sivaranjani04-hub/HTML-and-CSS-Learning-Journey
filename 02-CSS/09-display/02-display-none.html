<!DOCTYPE html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>display: none</title>
  <link rel="stylesheet" href="02-display-none.css">
</head>
<body>
  <p>Visible paragraph 1</p>
  <p class="hidden">I am hidden with display: none (you cannot see me, and I take no space).</p>
  <p>Visible paragraph 2 (it moved up to fill the gap)</p>
  <p class="invisible">visibility: hidden hides me but keeps the empty space.</p>
  <p>Visible paragraph 3 (there is a gap above)</p>
</body>
</html>
