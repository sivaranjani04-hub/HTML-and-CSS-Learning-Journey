<!DOCTYPE html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>display: flex</title>
  <link rel="stylesheet" href="01-flex-container.css">
</head>
<body>
  <h3>Without flex (block items stack)</h3>
  <div class="container"><div class="item">1</div><div class="item">2</div><div class="item">3</div></div>
  <h3>With display: flex (items sit in a row)</h3>
  <div class="container flex"><div class="item">1</div><div class="item">2</div><div class="item">3</div></div>
</body>
</html>
