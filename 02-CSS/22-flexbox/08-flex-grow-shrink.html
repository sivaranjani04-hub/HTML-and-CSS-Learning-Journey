<!DOCTYPE html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex-grow, flex-shrink, flex-basis</title>
  <link rel="stylesheet" href="08-flex-grow-shrink.css">
</head>
<body>
  <h3>flex-grow: free space is shared (1 : 2 : 1)</h3><div class="container g"><div class="item">1</div><div class="item">2 (grow 2)</div><div class="item">3</div></div>
  <h3>flex-basis: starting size</h3><div class="container b"><div class="item">basis 100px</div><div class="item">basis 300px</div><div class="item">auto</div></div>
  <h3>flex-shrink: 0 stops one item shrinking in a small container</h3><div class="container s"><div class="item">shrinks</div><div class="item noshrink">no shrink</div><div class="item">shrinks</div></div>
  <h3>flex shorthand: flex: grow shrink basis</h3><div class="container sh"><div class="item">1 1 0</div><div class="item">2 1 0</div></div>
</body>
</html>
