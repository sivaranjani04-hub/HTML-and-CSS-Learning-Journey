<!DOCTYPE html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>direction and timing-function</title>
  <link rel="stylesheet" href="03-direction-timing.css">
</head>
<body>
  <div class="track"><div class="ball d1"></div></div><p>normal</p>
  <div class="track"><div class="ball d2"></div></div><p>reverse</p>
  <div class="track"><div class="ball d3"></div></div><p>alternate (forward then back)</p>
  <div class="track"><div class="ball t1"></div></div><p>linear</p>
  <div class="track"><div class="ball t2"></div></div><p>ease-in</p>
  <div class="track"><div class="ball t3"></div></div><p>ease-out</p>
  <div class="track"><div class="ball t4"></div></div><p>ease-in-out</p>
</body>
</html>
