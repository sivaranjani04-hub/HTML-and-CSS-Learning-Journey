<!DOCTYPE html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CSS Dropdown Menu</h1>
  <p>Hover over the button.</p>
  <div class="dropdown">
    <button class="dropbtn">Courses</button>
    <div class="dropdown-content">
      <a href="#">HTML</a>
      <a href="#">CSS</a>
      <a href="#">JavaScript</a>
    </div>
  </div>
  <!-- A second dropdown to show it can be reused -->
  <div class="dropdown">
    <button class="dropbtn">Tools</button>
    <div class="dropdown-content">
      <a href="#">VS Code</a>
      <a href="#">Git</a>
    </div>
  </div>
</body>
</html>
