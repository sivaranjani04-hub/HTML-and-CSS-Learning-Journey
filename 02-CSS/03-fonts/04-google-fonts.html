<!DOCTYPE html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Fonts</title>
  <!-- Google Fonts are loaded from the internet using a <link>. Choose a font on fonts.google.com and copy the link -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="04-google-fonts.css">
</head>
<body>
  <h1>Google Fonts</h1>
  <p class="g">This text uses the Google font "Lobster" (needs internet).</p>
  <p>If you are offline, the fallback font cursive is used instead.</p>
</body>
</html>
