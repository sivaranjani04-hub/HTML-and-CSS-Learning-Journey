<!DOCTYPE html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>overflow-x and overflow-y</title>
  <link rel="stylesheet" href="03-overflow-x-y.css">
</head>
<body>
  <div class="box x"><b>overflow-x: scroll</b><br>Only horizontal scrolling. <span class="wide">This is a long line that does not wrap so it overflows horizontally.</span></div>
  <div class="box y"><b>overflow-y: scroll</b><br>Only vertical scrolling. This text is long enough to overflow the small box vertically so you can scroll down to read it all.</div>
</body>
</html>
