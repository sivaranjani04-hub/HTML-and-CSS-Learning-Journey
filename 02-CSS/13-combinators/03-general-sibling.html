<!DOCTYPE html>
<!-- DOCTYPE tells the browser this is a modern HTML5 page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>General sibling selector (~)</title>
  <link rel="stylesheet" href="03-general-sibling.css">
</head>
<body>
  <h1>General sibling: h2 ~ p</h1>
  <p>P before the h2 (not styled)</p>
  <h2>The h2</h2>
  <p>P after h2 #1 (BLUE)</p>
  <div>A div in between</div>
  <p>P after h2 #2 (BLUE too)</p>
</body>
</html>
